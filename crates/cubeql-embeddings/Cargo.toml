[package]
name = "cubeql-embeddings"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Model-independent text embedding providers, separate from CubeQL retrieval"

[features]
default = []
minilm = ["dep:candle-core", "dep:candle-nn", "dep:candle-transformers", "dep:tokenizers", "dep:sha2", "dep:ureq", "dep:tempfile"]

[dependencies]
blake3 = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
candle-core = { version = "=0.11.0", optional = true }
candle-nn = { version = "=0.11.0", optional = true }
candle-transformers = { version = "=0.11.0", optional = true }
tokenizers = { version = "=0.22.2", default-features = false, features = ["fancy-regex"], optional = true }
sha2 = { version = "0.10", optional = true }
ureq = { version = "3.4", default-features = false, features = ["rustls"], optional = true }
tempfile = { version = "3.27", optional = true }

[dev-dependencies]
tempfile = "3.27"
